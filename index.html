<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duitku Mega - Financial Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="top-bar">
        <div class="container bar-content">
            <div class="logo">
                <h1><i class="fa-solid fa-wallet"></i> DUITKU</h1>
            </div>
            <div class="actions">
                <button onclick="toggleTheme()" class="btn-icon"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
                <button onclick="toggleSound()" class="btn-icon"><i id="soundIcon" class="fa-solid fa-volume-high"></i></button>
                <button onclick="openResetModal()" class="btn-icon btn-reset"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="glow-card header-card">
            <div class="wallet-info">
                <select id="currentWallet" onchange="switchWallet()">
                    <option value="cash">💵 Cash</option>
                    <option value="bank">🏦 Bank</option>
                    <option value="ewallet">📱 E-Wallet</option>
                    <option value="credit">💳 Credit</option>
                </select>
                <span id="walletBalance" class="wallet-balance">Rp 0</span>
            </div>
            <div class="user-status">
                <span>LVL <span id="userLevel">1</span></span>
                <div class="xp-mini-bar"><div id="xpFill" style="width: 0%"></div></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card glow-card">
                <i class="fa-solid fa-calendar-day"></i>
                <div>
                    <span class="stat-label">Hari Ini</span>
                    <span id="todayTotal" class="stat-value">Rp 0</span>
                </div>
            </div>
            <div class="stat-card glow-card">
                <i class="fa-solid fa-piggy-bank"></i>
                <div>
                    <span class="stat-label">Tabungan</span>
                    <span id="savingsTotal" class="stat-value">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="glow-card budget-card">
            <div class="budget-header">
                <span>Anggaran Bulan Ini</span>
                <button onclick="openBudgetModal()" class="btn-icon"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>
            <div class="progress-bar">
                <div id="budgetProgress" class="progress"></div>
            </div>
            <div class="budget-info">
                <span id="budgetPercent">0%</span>
                <span id="budgetText">dari Rp 0</span>
            </div>
        </div>

        <div class="glow-card">
            <h2><i class="fa-solid fa-plus-circle"></i> Catat Pengeluaran</h2>
            <form id="expenseForm">
                <div class="input-group">
                    <input type="number" id="amount" placeholder="Jumlah (Rp)" required>
                </div>
                <div class="form-row">
                    <select id="category" required>
                        <option value="food">🍜 Makan</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="shopping">🛒 Belanja</option>
                        <option value="bills">💳 Tagihan</option>
                        <option value="health">💊 Kesehatan</option>
                        <option value="fun">🎮 Hiburan</option>
                        <option value="other">📦 Lainnya</option>
                    </select>
                    <input type="text" id="note" placeholder="Catatan...">
                </div>
                <button type="submit" class="btn-primary">SIMPAN TRANSAKSI</button>
            </form>
        </div>

        <div class="glow-card">
            <h2><i class="fa-solid fa-chart-pie"></i> Analisis</h2>
            <canvas id="expenseChart"></canvas>
        </div>

        <div id="expenseList">
            </div>
    </div>

    <div id="budgetModal" class="modal">
        <div class="modal-content">
            <h3>Set Budget Bulanan</h3>
            <input type="number" id="budgetInput" placeholder="Masukkan nominal...">
            <div class="modal-btns">
                <button onclick="saveBudget()" class="btn-primary">Simpan</button>
                <button onclick="closeBudgetModal()" class="btn-secondary">Batal</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
